name: Radares BORA (jueces + Presidencia BCRA)

# Desde 2026-10-22 el BORA (www.boletinoficial.gob.ar) no responde a las IP de los runners
# hospedados por GitHub (ConnectTimeout). Los radares leen el BORA a través del proxy de
# Cloudflare (00_Comun/bora_proxy.py), el mismo que usa el Radar de Desregulación de LyP.
# Requiere en el repo (Settings > Secrets and variables > Actions):
#   Variable  BORA_PROXY_URL    = https://bora-proxy-sam.politicaspublicas.workers.dev/
#   Secret    BORA_PROXY_TOKEN  = la misma clave cargada como TOKEN en el Worker
# El proxy es intermitente (algunos "lectores" no conectan), por eso hay VARIOS horarios por
# día: el radar es idempotente (dedup por URL en los CSV puente), así que repetir no duplica.

on:
  schedule:
    # lunes a viernes (el BORA publica la 1ra sección temprano). 12:30 UTC = 09:30 ART.
    - cron: '30 12 * * 1-5'   # 09:30 ART
    - cron: '30 15 * * 1-5'   # 12:30 ART — reintento si el proxy no conectó
    - cron: '30 19 * * 1-5'   # 16:30 ART — último intento del día
  workflow_dispatch:
    inputs:
      desde:
        description: 'Corrida histórica: fecha inicial YYYY-MM-DD (vacío = solo hoy)'
        required: false
        default: ''
      hasta:
        description: 'Corrida histórica: fecha final YYYY-MM-DD (vacío = hoy)'
        required: false
        default: ''

permissions:
  contents: write   # para commitear el CSV puente actualizado

# Evita que dos corridas pisen el mismo CSV si una se demora.
concurrency:
  group: radares-bora
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORA_PROXY_URL: ${{ vars.BORA_PROXY_URL }}
      BORA_PROXY_TOKEN: ${{ secrets.BORA_PROXY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r "07_Radar_Nombramientos/requirements.txt"
      - name: Tests de deteccion (regresion, sin red)
        run: |
          python "07_Radar_Nombramientos/radar_nombramientos.py" --test
          python "05_Banco_Central/radar_bcra.py" --test
          python "00_Comun/bora_proxy.py" --test
      - name: Correr radar
        env:
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
        run: |
          ARGS=""
          if [ -n "$DESDE" ]; then ARGS="--desde $DESDE"; fi
          if [ -n "$HASTA" ]; then ARGS="$ARGS --hasta $HASTA"; fi
          echo "Ejecutando: radar_nombramientos.py $ARGS"
          python "07_Radar_Nombramientos/radar_nombramientos.py" $ARGS
      - name: Correr radar Presidencia BCRA (alerta)
        # Corre aunque el radar judicial haya fallado (lectura parcial): son independientes.
        if: ${{ !cancelled() }}
        env:
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
        run: |
          ARGS=""
          if [ -n "$DESDE" ]; then ARGS="--desde $DESDE"; fi
          if [ -n "$HASTA" ]; then ARGS="$ARGS --hasta $HASTA"; fi
          echo "Ejecutando: radar_bcra.py $ARGS"
          python "05_Banco_Central/radar_bcra.py" $ARGS
      - name: Persistir CSV puente (si cambió)
        # También tras un fallo: lo detectado antes de la ficha ilegible no se pierde.
        # El job igual queda en rojo (fallar avisando).
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "radares-bora[bot]"
          git config user.email "radares-bora@users.noreplace.github.com"
          git add output/nombramientos_jueces.csv output/bajas_jueces.csv output/bcra_presidencia_eventos.csv 2>/dev/null || true
          if [ -n "$(git status --porcelain output/nombramientos_jueces.csv output/bajas_jueces.csv output/bcra_presidencia_eventos.csv)" ]; then
            git commit -m "Radares BORA: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          else
            echo "Sin cambios en los CSV puente."
          fi
